<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatZone - หาเพื่อนคุยสด</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ff4757; /* สีแดงสด แบบเว็บแชทคึกคัก */
            --bg-color: #1e272e;      /* พื้นหลังสีเข้ม ถนอมสายตา */
            --card-bg: #2f3640;
            --text-color: #f1f2f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Sarabun', sans-serif; /* แนะนำให้ใช้ Google Font ภาษาไทย */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://source.unsplash.com/random/1920x1080/?night,city');
            background-size: cover;
            background-position: center;
        }

        .login-container {
            background-color: rgba(47, 54, 64, 0.95);
            padding: 2rem;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            backdrop-filter: blur(5px);
        }

        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 1rem;
            color: var(--primary-color);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .logo span { color: #fff; }

        .stat-box {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #bdc3c7;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border: 2px solid #57606f;
            background: #dfe4ea;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
            background: #fff;
        }

        .gender-options {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .gender-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid #57606f;
            border-radius: 8px;
            background: transparent;
            color: #bdc3c7;
            cursor: pointer;
            transition: 0.2s;
        }

        .gender-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .options-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 8px;
        }

        .btn-enter {
            width: 100%;
            padding: 15px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-enter:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
        }

        .footer-text {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #7f8c8d;
        }

        /* Responsive Mobile */
        @media (max-width: 480px) {
            .login-container {
                width: 90%;
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo">Soi<span>Chat</span> <i class="fas fa-comments"></i></div>
        
        <div class="stat-box">
            <span><i class="fas fa-user"></i> ออนไลน์: <strong id="user-count">1,240</strong></span>
            <span><i class="fas fa-video"></i> กล้อง: <strong>580</strong></span>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <label>ชื่อเล่นของคุณ</label>
                <input type="text" id="username" placeholder="ใส่ชื่อเล่นเท่ๆ..." required maxlength="15">
            </div>

            <div class="input-group">
                <label>เพศ</label>
                <div class="gender-options">
                    <button type="button" class="gender-btn active" onclick="selectGender(this, 'male')"><i class="fas fa-mars"></i> ชาย</button>
                    <button type="button" class="gender-btn" onclick="selectGender(this, 'female')"><i class="fas fa-venus"></i> หญิง</button>
                    <button type="button" class="gender-btn" onclick="selectGender(this, 'lgbt')"><i class="fas fa-transgender"></i> อื่นๆ</button>
                </div>
                <input type="hidden" id="selectedGender" value="male">
            </div>

            <div class="options-toggle">
                <span><i class="fas fa-camera"></i> เปิดกล้อง</span>
                <input type="checkbox" id="cameraToggle">
            </div>

            <button type="submit" class="btn-enter">เข้าสู่ห้องแชท</button>
        </form>

        <p class="footer-text">
            การเข้าใช้งานถือว่ายอมรับข้อตกลงและเงื่อนไข<br>
            © 2024 SoiChat Clone Project
        </p>
    </div>

    <script>
        // ฟังก์ชันเลือกเพศ
        function selectGender(btn, value) {
            // ลบคลาส active จากปุ่มทั้งหมด
            document.querySelectorAll('.gender-btn').forEach(b => b.classList.remove('active'));
            // เพิ่มคลาส active ให้ปุ่มที่กด
            btn.classList.add('active');
            // อัปเดตค่าใน hidden input
            document.getElementById('selectedGender').value = value;
        }

        // จำลองตัวเลขคนออนไลน์ให้ขยับได้ เพื่อความสมจริง
        setInterval(() => {
            const countEl = document.getElementById('user-count');
            let current = parseInt(countEl.innerText.replace(',', ''));
            let change = Math.floor(Math.random() * 5) - 2; // สุ่มเลข -2 ถึง +2
            countEl.innerText = (current + change).toLocaleString();
        }, 3000);

        // จัดการเมื่อกดปุ่มเข้าห้อง
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const gender = document.getElementById('selectedGender').value;
            const hasCamera = document.getElementById('cameraToggle').checked;

            if(username.trim() === "") {
                alert("กรุณาตั้งชื่อเล่นก่อนครับ");
                return;
            }

            // --- ตรงนี้คือจุดเชื่อมต่อกับ Backend ของคุณ ---
            console.log("กำลังเข้าสู่ระบบ:", { username, gender, hasCamera });
            
            // ตัวอย่างการส่งค่าไปหน้าถัดไป หรือส่งไป Socket
            // window.location.href = `/chat?user=${username}&gender=${gender}`;
            alert(`ยินดีต้อนรับคุณ ${username}! กำลังเข้าสู่ห้องแชท...`);
        });
    </script>
</body>
</html>
